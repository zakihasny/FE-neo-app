# Isolated local/CI fixtures only. These credentials are not for production.
services:

  database:
    image: redis:8.2.11-alpine
    command: ['redis-server', '--requirepass', 'ci-redis-not-for-production', '--appendonly', 'yes', '--appendfsync', 'always', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:16379:6379']
    volumes: [database-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=ci-redis-not-for-production redis-cli ping | grep PONG']
      interval: 2s
      timeout: 5s
      retries: 60

  queue:
    image: nats:2.12.11-alpine
    command: ['-js', '-sd', '/data', '--user', 'ci', '--pass', 'ci-nats-not-for-production']
    ports: ['127.0.0.1:14222:4222']
    volumes: [queue-data:/data]
  app: &app
    build: .
    image: fe-db-variant-ci:local
    environment:
      REDIS_URL: redis://:ci-redis-not-for-production@database:6379/0
      REDIS_KEY_PREFIX: fe-neo-app
      NATS_URL: nats://ci:ci-nats-not-for-production@queue:4222
      NODE_ENV: production
      PORT: '8080'
      RUN_DB_MIGRATIONS: 'true'
      SEED_SAMPLE_DATA: 'true'
    depends_on:
      database:
        condition: service_healthy
      queue:
        condition: service_started
    ports: ['127.0.0.1:18080:8080']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s
  app2:
    <<: *app
    ports: []
volumes:
  database-data:
  queue-data:
